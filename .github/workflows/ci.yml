name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spendwise
          POSTGRES_PASSWORD: spendwise
          POSTGRES_DB: spendwise_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U spendwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Settings are required at import time. Tests only use TEST_DATABASE_URL (its name must
      # end in _test) and replace the LLM with a scripted fake, so these values are CI-only.
      DATABASE_URL: postgresql+psycopg://spendwise:spendwise@localhost:5433/spendwise_test
      TEST_DATABASE_URL: postgresql+psycopg://spendwise:spendwise@localhost:5433/spendwise_test
      SECRET_KEY: ci-only-signing-key-not-a-real-secret-0123456789
      LLM_BASE_URL: http://localhost:11434/v1
      LLM_API_KEY: unused-in-tests
      LLM_MODEL: unused-in-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
